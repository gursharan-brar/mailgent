[project]
name = "helpdesk-voice"
version = "0.1.0"
description = "Tier 1 IT help desk agent (text and voice) with simulated callers and an LLM grader."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real speech models (Phase 3). Not needed for tests: the fake adapters cover them.
voice = ["faster-whisper>=1.1", "piper-tts>=1.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
